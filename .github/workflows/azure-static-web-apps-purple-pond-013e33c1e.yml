name: Azure Static Web Apps CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - main

jobs:
  build_and_deploy_job:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    name: Build and Deploy Job
    env:
      AZURE_STATIC_WEB_APPS_API_TOKEN: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          submodules: true
          lfs: false
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Validate deployment token is present
        id: token-check
        run: |
          if [ -z "${AZURE_STATIC_WEB_APPS_API_TOKEN}" ]; then
            echo "::error ::AZURE_STATIC_WEB_APPS_API_TOKEN is empty. Add it in GitHub repo Settings > Secrets and variables > Actions."
            exit 1
          fi
          CLEAN_TOKEN=$(printf '%s' "${AZURE_STATIC_WEB_APPS_API_TOKEN}" | tr -d '\r\n')
          CLEAN_TOKEN=$(printf '%s' "$CLEAN_TOKEN" | sed -E 's/^[[:space:]]+|[[:space:]]+$//g')
          CLEAN_TOKEN="${CLEAN_TOKEN#\"}"
          CLEAN_TOKEN="${CLEAN_TOKEN%\"}"
          echo "Token length (trimmed): ${#CLEAN_TOKEN}"
          if [ "${CLEAN_TOKEN}" != "${AZURE_STATIC_WEB_APPS_API_TOKEN}" ]; then
            echo "::warning ::Token had extra characters trimmed. This can cause deploy rejection."
          fi
          echo "Token preview: ${CLEAN_TOKEN:0:4}...${CLEAN_TOKEN: -4}"
          echo "token=${CLEAN_TOKEN}" >> "$GITHUB_OUTPUT"
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: |
          npm run build
          cp staticwebapp.config.json dist/staticwebapp.config.json
      - name: Build And Deploy
        id: builddeploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ steps.token-check.outputs.token }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: "upload"
          app_location: "."
          api_location: "api"
          output_location: "dist"
          skip_app_build: true

  close_pull_request_job:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close Pull Request Job
    steps:
      - name: Close Pull Request
        id: closepullrequest
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: "close"
